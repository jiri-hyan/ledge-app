<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b2133"/>
      <stop offset="1" stop-color="#090b12"/>
    </linearGradient>
    <linearGradient id="ledge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- záře pod římsou -->
    <rect x="232" y="214" width="560" height="84" rx="42" fill="url(#ledge)" opacity="0.75" filter="url(#glow)"/>
    <!-- šuplík vysunutý z římsy -->
    <path d="M262 300 H762 Q802 300 802 340 V700 Q802 772 730 772 H294 Q222 772 222 700 V340 Q222 300 262 300 Z"
          fill="url(#drawer)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6"/>
    <!-- obsah šuplíku: dlaždice + řádky -->
    <rect x="290" y="372" width="120" height="120" rx="30" fill="#8b5cf6" opacity="0.9"/>
    <rect x="452" y="372" width="120" height="120" rx="30" fill="#22d3ee" opacity="0.85"/>
    <rect x="614" y="372" width="120" height="120" rx="30" fill="#ffffff" opacity="0.18"/>
    <rect x="290" y="560" width="444" height="34" rx="17" fill="#ffffff" opacity="0.32"/>
    <rect x="290" y="638" width="300" height="34" rx="17" fill="#ffffff" opacity="0.18"/>
    <!-- upozornění (Claude čeká / připomínka) -->
    <circle cx="700" cy="655" r="30" fill="#f59e0b"/>
    <!-- římsa -->
    <rect x="232" y="214" width="560" height="84" rx="42" fill="url(#ledge)"/>
    <rect x="262" y="226" width="500" height="18" rx="9" fill="#ffffff" opacity="0.28"/>
  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="227" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
</svg>
