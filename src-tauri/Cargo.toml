[package]
name = "ledge"
version = "0.2.0"
description = "Ledge — šuplík u horního okraje obrazovky: projekty, servery, schvalování pro Claude Code"
authors = ["Jiří Hyan"]
edition = "2024"

[lib]
name = "ledge_lib"
# staticlib + cdylib NECHÁNO: šablona Tauri 2 je má kvůli mobilním cílům; že je desktopový `tauri build` nevyžaduje, jsme neověřili (build se nesmí spouštět)
crate-type = ["staticlib", "cdylib", "rlib"]
# bez doctestů: knihovna je jen vnitřek aplikace, žádná veřejná API s příklady (každý doctest = zbytečný překlad + linkování)
doctest = false

# main.rs jsou jen 3 větve spuštění (statusline / mcp / run) bez testů — nesestavovat zbytečně druhý testovací binár
[[bin]]
name = "ledge"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: ikona v oznamovací oblasti (`tray.rs`); crate `tray-icon` + `muda` už ve stromu jsou (Cargo.lock)
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# nativní výběr složky/souboru/exe a „Uložit jako“ v Nastavení (volá se jen z Rustu)
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
notify = "8"
tiny_http = "0.12"
regex = "1"
# čas s lokálním offsetem pro poznámky/připomínky (už je ve stromu přes tauri)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
# počasí (Open-Meteo): reqwest už je ve stromu přes tauri (stejná verze, bez TLS) — přidává se jen
# TLS přes systémový SChannel (native-tls), žádný rustls/ring v binárce; async běží na runtime Tauri
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn"] }
# SHA256 staženého instalátoru (update.rs) — sha2 už je ve stromu přes tauri-codegen
sha2 = "0.10"
# podpis instalátoru (updsign.rs): ověření minisign / Ed25519 — jediná nová crate, bez závislostí (autor
# minisign, totéž ověření používá tauri-plugin-updater); base64 obalu `.sig` z `tauri signer` už je ve stromu
minisign-verify = "0.3"
base64 = "0.22"
# útrata Claude: rychlé hledání v řádcích transcriptů (memmem) — už je ve stromu přes regex
memchr = "2"
winreg = "0.55"
windows-numerics = "0.3"
# makro `#[implement]` (COM objekty přihrádky `shelf/drop.rs`) chce `windows_core` v kořeni — už je ve stromu přes `windows`
windows-core = "0.62"
webview2-com = "0.39"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  # loga projektů: dekódování/zmenšení/PNG přes WIC (součást Windows — žádná crate navíc)
  "Win32_Graphics_Imaging",
  "Win32_NetworkManagement_IpHelper",
  # karta Systém (`sysmon/`): rychlost sítě z GetIfTable2 (MIB_IF_ROW2 chce typy Ndis)
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  # účty Microsoft/Google (`accounts/`): refresh tokeny ve Správci pověření (CredWriteW/CredReadW),
  # náhoda pro PKCE a state ze systémového CSPRNG (BCryptGenRandom)
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  # rychlé akce: ikona souboru/složky (SHGetFileInfo + seznam ikon 48 px), výběr cesty (IFileOpenDialog); průvodce: IShellLinkW::GetPath
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  # přihrádka (`shelf/`): cíl přetažení na proužku a přetažení ven (OLE), text do schránky
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  # historie schránky (`cliphist/`): smazat nepřipnuté při zamčení stanice (WTSRegisterSessionNotification)
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  # bublina MSIX (`pkgctx.rs`: GetCurrentPackageFullName) a spuštění mimo ni (`outside.rs`: Plánovač úloh)
  "Win32_Storage_Packaging_Appx",
  "Win32_System_TaskScheduler",
  # tiché pípnutí u schvalování Clauda (`approvalsound.rs`: MessageBeep)
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  # toast „Claude čeká / hotovo“ (`toast.rs`, config `claude.toast`): WinRT ze stejné crate, žádná nová
  "Data_Xml_Dom",
  "UI_Notifications",
  # záložka Osobní (`media.rs`, `volume.rs`, `battery.rs`): právě hraje (GSMTC, WinRT + obal přes
  # Storage.Streams), hlasitost výchozího výstupu (Core Audio), baterie (stav + oznámení o změně)
  "Foundation",
  # karta Rychlé dlaždice (`winquickwin.rs`): rádia Wi-Fi / Bluetooth (Windows.Devices.Radios)
  "Devices_Radios",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Power",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
]

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
# závislosti bez ladicích symbolů: menší .rlib / .pdb, rychlejší linkování testů; vlastní kód má debug dál
debug = false

[profile.release]
# thin LTO + 16 jednotek: vydání se překládá paralelně (fat/1 = jedno jádro, 12–61 min); měřeno od 0.9.0
codegen-units = 16
lto = "thin"
opt-level = 3
# unwind: panika v jednom vlákně (hover, procman) nesmí shodit celý Ledge
panic = "unwind"
strip = true
